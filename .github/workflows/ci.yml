name: Debian 13 foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check shell syntax and critical ShellCheck errors
        run: |
          bash -n install.sh installer/install.sh scripts/tomos-sipserver-check scripts/tomos-sipserver-apply-config
          shellcheck --severity=error install.sh installer/install.sh scripts/tomos-sipserver-check scripts/tomos-sipserver-apply-config
      - name: Install API test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  debian-13-asterisk-source:
    runs-on: ubuntu-latest
    container:
      image: debian:13
    steps:
      - uses: actions/checkout@v5
      - name: Install Asterisk build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bison flex libtool-bin git wget curl ca-certificates pkg-config python3 openssl \
            libxml2-dev libncurses-dev uuid-dev libsqlite3-dev libssl-dev libedit-dev \
            libjansson-dev libcurl4-openssl-dev libnewt-dev libspandsp-dev libsrtp2-dev \
            libspeexdsp-dev libopus-dev libogg-dev libvorbis-dev libasound2-dev libxslt1-dev gettext python3-venv sudo
      - name: Download and verify pinned Asterisk source
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION=22.12.0
          URL="https://github.com/asterisk/asterisk/releases/download/${VERSION}/asterisk-${VERSION}.tar.gz"
          curl --fail --location --retry 3 "$URL" --output /tmp/asterisk.tar.gz
          EXPECTED=f8b2ba98aac6c4ff3376bc0a2868bea6ed577ca684efb7ec739ae6e8ce6e35e2
          printf '%s  %s\n' "$EXPECTED" /tmp/asterisk.tar.gz | sha256sum --check
          mkdir -p /usr/src/tomos
          tar -xzf /tmp/asterisk.tar.gz -C /usr/src/tomos
      - name: Install Asterisk-specific prerequisites
        working-directory: /usr/src/tomos/asterisk-22.12.0
        run: ./contrib/scripts/install_prereq install
      - name: Configure Asterisk
        working-directory: /usr/src/tomos/asterisk-22.12.0
        run: ./configure --with-pjproject-bundled --with-jansson-bundled
      - name: Build Asterisk
        working-directory: /usr/src/tomos/asterisk-22.12.0
        run: |
          make menuselect.makeopts
          make -j2
      - name: Install Asterisk
        working-directory: /usr/src/tomos/asterisk-22.12.0
        run: |
          make install
          make install-headers
          make samples
      - name: Build pinned chan_sccp for Asterisk 22
        shell: bash
        run: |
          set -Eeuo pipefail
          SCCP_COMMIT=9591e4583c0c3b682d30d253ce77d596f040acf8
          git clone --no-checkout https://github.com/AI3I/chan_sccp.git /usr/src/chan_sccp
          git -C /usr/src/chan_sccp fetch --depth 1 origin "$SCCP_COMMIT"
          git -C /usr/src/chan_sccp checkout --detach "$SCCP_COMMIT"
          cd /usr/src/chan_sccp
          ./configure --with-asterisk=/usr
          make -j2
          make install
      - name: Configure TomOS test extensions
        run: |
          groupadd --system asterisk || true
          useradd --system --gid asterisk --home-dir /var/lib/asterisk --create-home --shell /usr/sbin/nologin asterisk || true
          install -d -o asterisk -g asterisk -m 0750 /var/lib/asterisk /var/log/asterisk /var/spool/asterisk /run/asterisk
          install -m 0644 asterisk/asterisk.conf /etc/asterisk/asterisk.conf
          install -m 0644 asterisk/modules.conf /etc/asterisk/modules.conf
          install -m 0640 asterisk/sccp.conf /etc/asterisk/sccp.conf
          install -m 0644 asterisk/logger.conf /etc/asterisk/logger.conf
          install -m 0644 asterisk/rtp.conf /etc/asterisk/rtp.conf
          install -m 0644 asterisk/cdr.conf /etc/asterisk/cdr.conf
          install -m 0644 asterisk/cdr_sqlite3_custom.conf /etc/asterisk/cdr_sqlite3_custom.conf
          python3 scripts/render-config.py --output-dir /etc/asterisk \
            --extension "100:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --extension "101:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          cat >> /etc/asterisk/extensions.conf <<'EOF'
          [tomos-cdr-test]
          exten => 900,1,Set(CALLERID(num)=100)
           same => n,Answer()
           same => n,Wait(1)
           same => n,Hangup()
          EOF
          chown root:asterisk /etc/asterisk/pjsip.conf /etc/asterisk/extensions.conf
          chmod 0640 /etc/asterisk/pjsip.conf /etc/asterisk/extensions.conf
      - name: Prepare API integration environment
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd --system --create-home --home-dir /var/lib/tomos-sipserver --shell /usr/sbin/nologin tomos
          groupadd --system tomos-cdr
          usermod --append --groups tomos-cdr asterisk
          usermod --append --groups tomos-cdr tomos
          install -d -o tomos -g tomos -m 0700 /var/lib/tomos-sipserver
          chgrp tomos-cdr /var/lib/tomos-sipserver
          chmod 0710 /var/lib/tomos-sipserver
          install -d -o root -g tomos-cdr -m 2770 /var/lib/tomos-sipserver/cdr
          install -d -o root -g root -m 0755 /opt/tomos-sipserver/app
          cp -a tomos_sipserver /opt/tomos-sipserver/app/
          install -m 0644 scripts/render-config.py /opt/tomos-sipserver/app/render-config.py
          python3 -m venv /opt/tomos-sipserver/venv
          /opt/tomos-sipserver/venv/bin/pip install --disable-pip-version-check --requirement requirements.txt
          PYTHONPATH=/opt/tomos-sipserver/app /opt/tomos-sipserver/venv/bin/python -m tomos_sipserver.db \
            --database /var/lib/tomos-sipserver/extensions.db \
            --seed-extension "100:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --seed-extension "101:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          chown tomos:tomos /var/lib/tomos-sipserver/extensions.db
          install -D -o root -g root -m 0755 scripts/tomos-sipserver-apply-config /usr/local/sbin/tomos-sipserver-apply-config
          install -D -o root -g root -m 0755 scripts/tomos-sipserver-status /usr/local/sbin/tomos-sipserver-status
          install -D -o root -g root -m 0440 sudoers/tomos-sipserver-api /etc/sudoers.d/tomos-sipserver-api
          visudo -cf /etc/sudoers.d/tomos-sipserver-api
      - name: Start Asterisk and verify PJSIP endpoints and dialplan
        shell: bash
        run: |
          set -Eeuo pipefail
          runuser -u asterisk -- asterisk -f &
          ASTERISK_PID=$!
          cleanup() {
            asterisk -rx 'core stop now' >/dev/null 2>&1 || kill "$ASTERISK_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if asterisk -rx 'core show version' >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [[ "$READY" -ne 1 ]]; then
            echo "Asterisk did not become ready within 30 seconds" >&2
            exit 1
          fi
          ENDPOINTS="$(asterisk -rx 'pjsip show endpoints')"
          asterisk -rx 'cdr show status'
          grep -Fq 'cdr_sqlite3_custom.so' <<<"$(asterisk -rx 'module show like cdr_sqlite3_custom')"
          test -f /var/lib/tomos-sipserver/cdr/cdr.db
          asterisk -rx 'dialplan reload'
          asterisk -rx 'channel originate Local/900@tomos-cdr-test application Wait 1'
          CDR_READY=0
          for attempt in $(seq 1 15); do
            if python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("file:/var/lib/tomos-sipserver/cdr/cdr.db?mode=ro", uri=True)
          row = db.execute("SELECT src, dst, disposition FROM cdr WHERE dst = '900' ORDER BY calldate DESC LIMIT 1").fetchone()
          raise SystemExit(0 if row and row[2] == "ANSWERED" else 1)
          PY
            then CDR_READY=1; break; fi
            sleep 1
          done
          if [[ "$CDR_READY" -ne 1 ]]; then
            echo "Asterisk did not write the expected answered test CDR" >&2
            sqlite3 /var/lib/tomos-sipserver/cdr/cdr.db 'SELECT calldate,src,dst,disposition FROM cdr;' || true
            exit 1
          fi
          printf '%s\n' "$ENDPOINTS"
          grep -Fq '100/100' <<<"$ENDPOINTS"
          grep -Fq '101/101' <<<"$ENDPOINTS"
          SCCP_MODULES="$(asterisk -rx 'module show like chan_sccp.so')"
          printf '%s\\n' "$SCCP_MODULES"
          grep -Fq 'chan_sccp.so' <<<"$SCCP_MODULES"
          SCCP_DEVICES="$(asterisk -rx 'sccp show devices')"
          printf '%s\\n' "$SCCP_DEVICES"
          STATUS="$(/usr/local/sbin/tomos-sipserver-status)"
          grep -Fq '"status": "online"' <<<"$STATUS"
          grep -Fq '"registered_count": 0' <<<"$STATUS"
          DIALPLAN="$(asterisk -rx 'dialplan show tomos-internal')"
          printf '%s\n' "$DIALPLAN"
          grep -Fq '100' <<<"$DIALPLAN"
          grep -Fq '101' <<<"$DIALPLAN"

          API_TOKEN=ci-integration-token-0123456789abcdef0123456789abcdef
          runuser -u tomos -- env \
            PYTHONPATH=/opt/tomos-sipserver/app \
            TOMOS_API_TOKEN="$API_TOKEN" \
            TOMOS_ADMIN_PASSWORD="ci-admin-password-0123456789abcdef" \
            TOMOS_DB_PATH=/var/lib/tomos-sipserver/extensions.db \
            /opt/tomos-sipserver/venv/bin/uvicorn tomos_sipserver.api:create_app --factory --host 127.0.0.1 --port 8000 &
          API_PID=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          DASH_STATUS="$(curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/dashboard/status -H "Authorization: Bearer $API_TOKEN")"
          grep -Fq '"status":"online"' <<<"$DASH_STATUS"
          CALL_HISTORY="$(curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/calls -H "Authorization: Bearer $API_TOKEN")"
          python3 -c 'import json,sys; payload=json.load(sys.stdin); assert payload["total"] >= 1, payload; assert any(call["destination"] == "900" and call["disposition"] == "ANSWERED" for call in payload["calls"]), payload' <<<"$CALL_HISTORY"
          AUTH_HEADER="Authorization: Bearer $API_TOKEN"
          CREATED="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/extensions \
            -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
            -d '{"extension":"120","display_name":"CI Test Phone"}')"
          grep -Fq '"extension":"120"' <<<"$CREATED"

          YEALINK_CREATED="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/devices/yealink \
            -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
            -d '{"extension":"120","mac":"00:15:65:aa:bb:cc","model":"SIP-T46U","server_host":"127.0.0.1"}')"
          YEALINK_PATH="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_path"])' <<<"$YEALINK_CREATED")"
          YEALINK_USER="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_username"])' <<<"$YEALINK_CREATED")"
          YEALINK_PASSWORD="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_password"])' <<<"$YEALINK_CREATED")"
          YEALINK_CFG="$(curl --fail --silent --show-error --user "$YEALINK_USER:$YEALINK_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$YEALINK_PATH")"
          grep -Fq '#!version:1.0.0.1' <<<"$YEALINK_CFG"
          grep -Fq 'account.1.user_name = 120' <<<"$YEALINK_CFG"
          YEALINK_SIP_PASSWORD="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sip_password"])' <<<"$CREATED")"
          grep -Fq "account.1.password = $YEALINK_SIP_PASSWORD" <<<"$YEALINK_CFG"

          YEALINK_ROTATED="$(curl --fail --silent --show-error -X POST "http://127.0.0.1:8000/api/v1/devices/yealink/001565aabbcc/credentials" -H "$AUTH_HEADER")"
          YEALINK_NEW_PASSWORD="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_password"])' <<<"$YEALINK_ROTATED")"
          OLD_CREDENTIAL_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$YEALINK_USER:$YEALINK_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$YEALINK_PATH")"
          test "$OLD_CREDENTIAL_STATUS" = "401"
          curl --fail --silent --show-error --user "$YEALINK_USER:$YEALINK_NEW_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$YEALINK_PATH" | grep -Fq 'account.1.user_name = 120'

          GRANDSTREAM_CREATED="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/devices/grandstream \
            -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
            -d '{"extension":"120","mac":"00:0b:82:12:34:56","model":"GRP2601","server_host":"127.0.0.1"}')"
          GRANDSTREAM_PATH="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_path"])' <<<"$GRANDSTREAM_CREATED")"
          GRANDSTREAM_USER="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_username"])' <<<"$GRANDSTREAM_CREATED")"
          GRANDSTREAM_PASSWORD="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_password"])' <<<"$GRANDSTREAM_CREATED")"
          GRANDSTREAM_XML="$(curl --fail --silent --show-error --user "$GRANDSTREAM_USER:$GRANDSTREAM_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$GRANDSTREAM_PATH")"
          python3 -c 'import sys,xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); assert root.findtext("mac")=="000b82123456"; items={x.attrib["name"]:x.text for x in root.findall("./config/item")}; assert items["account.1.sip.userid"]=="120"; assert items["account.1.sip.subscriber.password"]==sys.argv[1]; assert items["account.1.sip.server.1.address"]=="127.0.0.1:5060"' "$YEALINK_SIP_PASSWORD" <<<"$GRANDSTREAM_XML"
          GRANDSTREAM_ROTATED="$(curl --fail --silent --show-error -X POST "http://127.0.0.1:8000/api/v1/devices/grandstream/000b82123456/credentials" -H "$AUTH_HEADER")"
          GRANDSTREAM_NEW_PASSWORD="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_password"])' <<<"$GRANDSTREAM_ROTATED")"
          GRANDSTREAM_OLD_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$GRANDSTREAM_USER:$GRANDSTREAM_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$GRANDSTREAM_PATH")"
          test "$GRANDSTREAM_OLD_STATUS" = "401"
          curl --fail --silent --show-error --user "$GRANDSTREAM_USER:$GRANDSTREAM_NEW_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$GRANDSTREAM_PATH" | grep -Fq '<gs_provision'

          POLYCOM_CREATED="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/devices/polycom \
            -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
            -d '{"extension":"120","mac":"00:04:f2:12:34:56","model":"VVX450","server_host":"127.0.0.1","server_port":5061,"transport":"TLS"}')"
          POLYCOM_PATH="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_path"])' <<<"$POLYCOM_CREATED")"
          POLYCOM_USER="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_username"])' <<<"$POLYCOM_CREATED")"
          POLYCOM_PASSWORD="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_password"])' <<<"$POLYCOM_CREATED")"
          POLYCOM_CFG="$(curl --fail --silent --show-error --user "$POLYCOM_USER:$POLYCOM_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$POLYCOM_PATH")"
          python3 -c 'import sys,xml.etree.ElementTree as ET; reg=ET.fromstring(sys.stdin.read()).find("reg"); assert reg.attrib["reg.1.address"]=="120"; assert reg.attrib["reg.1.auth.userId"]=="120"; assert reg.attrib["reg.1.auth.password"]==sys.argv[1]; assert reg.attrib["reg.1.server.1.address"]=="127.0.0.1"; assert reg.attrib["reg.1.server.1.port"]=="5061"; assert reg.attrib["reg.1.server.1.transport"]=="TLS"' "$YEALINK_SIP_PASSWORD" <<<"$POLYCOM_CFG"
          POLYCOM_ROTATED="$(curl --fail --silent --show-error -X POST "http://127.0.0.1:8000/api/v1/devices/polycom/0004f2123456/credentials" -H "$AUTH_HEADER")"
          POLYCOM_NEW_PASSWORD="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["provisioning_password"])' <<<"$POLYCOM_ROTATED")"
          POLYCOM_OLD_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$POLYCOM_USER:$POLYCOM_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$POLYCOM_PATH")"
          test "$POLYCOM_OLD_STATUS" = "401"
          curl --fail --silent --show-error --user "$POLYCOM_USER:$POLYCOM_NEW_PASSWORD" \
            -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$POLYCOM_PATH" | grep -Fq '<polycomConfig'

          LIST="$(curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/extensions -H "$AUTH_HEADER")"
          grep -Fq '"extension":"120"' <<<"$LIST"
          if grep -Fq 'sip_password' <<<"$LIST"; then
            echo "Extension list unexpectedly exposed a SIP password" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X PATCH http://127.0.0.1:8000/api/v1/extensions/120 \
            -H "$AUTH_HEADER" -H 'Content-Type: application/json' -d '{"display_name":"Updated CI Phone"}' >/dev/null
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/extensions/120/password \
            -H "$AUTH_HEADER" >/dev/null
          ENDPOINTS="$(asterisk -rx 'pjsip show endpoints')"
          grep -Fq '120/120' <<<"$ENDPOINTS"
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/extensions/120/disable \
            -H "$AUTH_HEADER" >/dev/null
          ENDPOINTS="$(asterisk -rx 'pjsip show endpoints')"
          if grep -Fq '120/120' <<<"$ENDPOINTS"; then
            echo "Disabled extension 120 is still loaded in PJSIP" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X DELETE http://127.0.0.1:8000/api/v1/extensions/120 \
            -H "$AUTH_HEADER" >/dev/null
          kill "$API_PID" 2>/dev/null || true
