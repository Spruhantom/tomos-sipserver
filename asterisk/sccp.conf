; TomOS Cisco SCCP channel driver baseline.
; Phone-specific SEP<MAC>.cnf.xml provisioning is a separate follow-up stage.
[general]
bindaddr = 0.0.0.0
port = 2000
context = tomos-internal
deny = 0.0.0.0/0.0.0.0
permit = 10.0.0.0/8
permit = 172.16.0.0/12
permit = 192.168.0.0/16

; TomOS-managed device and line sections, regenerated from the SQLite inventory.
#include tomos-sccp-devices.conf
#include "tomos-devices.conf"
