; TomOS SIP Server HTTP/WebSocket listener.
; Plain HTTP is loopback-only. Browser SIP uses WSS with a certificate trusted
; by the browser. Replace the bootstrap certificate with a publicly trusted
; certificate whose SAN matches the hostname used in the dashboard.
[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.crt
tlsprivatekey=/etc/asterisk/keys/asterisk.key
